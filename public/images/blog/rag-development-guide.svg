<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="50%" stop-color="#14223d"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26334f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#111c30" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>
  <rect width="1200" height="630" fill="url(#grid5)"/>

  <!-- Ambient Glows -->
  <circle cx="320" cy="200" r="280" fill="#d97706" opacity="0.16" filter="blur(60px)"/>
  <circle cx="920" cy="400" r="240" fill="#fbbf24" opacity="0.14" filter="blur(60px)"/>

  <!-- Header Badge -->
  <rect x="80" y="80" width="180" height="36" rx="18" fill="rgba(217, 119, 6, 0.25)" stroke="#fbbf24" stroke-width="1"/>
  <text x="170" y="103" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">RAG ARCHITECTURE</text>

  <!-- Title & Subtitle -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    RAG Development Guide: Grounding
  </text>
  <text x="80" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#amberGrad)" letter-spacing="-0.5">
    AI on Enterprise CRM Knowledge
  </text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">
    Vector Databases • Semantic Chunking • Hybrid BM25 Search • Cross-Encoder Rerankers
  </text>

  <!-- RAG Pipeline Flow Diagram -->
  <g transform="translate(80, 330)">
    <!-- Stage 1: Document Chunking -->
    <rect x="0" y="20" width="220" height="130" rx="14" fill="url(#cardGrad5)" stroke="#d97706" stroke-width="1.5"/>
    <text x="20" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#d97706" letter-spacing="1">01 INGESTION</text>
    <text x="20" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Document Parsing</text>
    <text x="20" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">PDFs, SOPs &amp; CRM history</text>
    <text x="20" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">semantic chunking splits</text>

    <!-- Arrow 1 -->
    <path d="M 220 85 L 290 85" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="290,85 282,80 282,90" fill="#fbbf24"/>

    <!-- Stage 2: Vector DB -->
    <rect x="290" y="10" width="240" height="150" rx="14" fill="url(#cardGrad5)" stroke="#fbbf24" stroke-width="2"/>
    <text x="310" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">02 VECTOR INDEX</text>
    <text x="310" y="72" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">pgvector / Qdrant</text>
    <text x="310" y="96" font-family="sans-serif" font-size="12" fill="#94a3b8">Dense 1536-dim vectors</text>
    <text x="310" y="114" font-family="sans-serif" font-size="12" fill="#94a3b8">+ Sparse BM25 keyword</text>
    <text x="310" y="136" font-family="monospace" font-size="11" fill="#38bdf8">hybrid_search(alpha=0.6)</text>

    <!-- Arrow 2 -->
    <path d="M 530 85 L 600 85" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="600,85 592,80 592,90" fill="#fbbf24"/>

    <!-- Stage 3: Reranker -->
    <rect x="600" y="20" width="230" height="130" rx="14" fill="url(#cardGrad5)" stroke="#d97706" stroke-width="1.5"/>
    <text x="620" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#d97706" letter-spacing="1">03 RERANKING</text>
    <text x="620" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Cross-Encoder</text>
    <text x="620" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">Scores relevance of top 20</text>
    <text x="620" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">Selects top 3 exact facts</text>

    <!-- Arrow 3 -->
    <path d="M 830 85 L 890 85" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="890,85 882,80 882,90" fill="#fbbf24"/>

    <!-- Stage 4: Grounded LLM -->
    <rect x="890" y="20" width="200" height="130" rx="14" fill="url(#cardGrad5)" stroke="#10b981" stroke-width="1.5"/>
    <text x="910" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">04 GROUNDED LLM</text>
    <text x="910" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Verified Answer</text>
    <text x="910" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">Zero hallucination</text>
    <text x="910" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">With source citations</text>
  </g>

  <!-- Brand Signature -->
  <text x="1120" y="580" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="end">GHLVertex RAG Architecture</text>
</svg>
