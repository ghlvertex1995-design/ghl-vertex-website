<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e21"/>
      <stop offset="50%" stop-color="#141c3b"/>
      <stop offset="100%" stop-color="#070a1a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e254d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#111633" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect width="1200" height="630" fill="url(#grid3)"/>

  <!-- Ambient Glows -->
  <circle cx="320" cy="200" r="280" fill="#6366f1" opacity="0.16" filter="blur(60px)"/>
  <circle cx="900" cy="400" r="240" fill="#a855f7" opacity="0.14" filter="blur(60px)"/>

  <!-- Header Badge -->
  <rect x="80" y="80" width="180" height="36" rx="18" fill="rgba(99, 102, 241, 0.25)" stroke="#a855f7" stroke-width="1"/>
  <text x="170" y="103" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#a855f7" text-anchor="middle" letter-spacing="1">AI AGENTS GUIDE</text>

  <!-- Title & Subtitle -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    How to Build and Deploy
  </text>
  <text x="80" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#purpleGrad)" letter-spacing="-0.5">
    Autonomous AI Agents in Business
  </text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">
    Tool Calling • CRM Read/Write • Memory Persistence • Human-in-the-Loop Guardrails
  </text>

  <!-- Agent Execution Flow Diagram -->
  <g transform="translate(80, 330)">
    <!-- Node 1: Inbound Intent -->
    <rect x="0" y="20" width="230" height="130" rx="14" fill="url(#cardGrad3)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 01: INTENT</text>
    <text x="20" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Natural Language</text>
    <text x="20" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">Customer asks for pricing,</text>
    <text x="20" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">service or booking time</text>

    <!-- Arrow 1 -->
    <path d="M 230 85 L 290 85" stroke="#a855f7" stroke-width="2"/>
    <polygon points="290,85 282,80 282,90" fill="#a855f7"/>

    <!-- Node 2: Reasoning Core -->
    <rect x="290" y="10" width="240" height="150" rx="14" fill="url(#cardGrad3)" stroke="#a855f7" stroke-width="2"/>
    <text x="310" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#a855f7" letter-spacing="1">STEP 02: REASONING</text>
    <text x="310" y="72" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">LLM Function Call</text>
    <text x="310" y="96" font-family="sans-serif" font-size="12" fill="#94a3b8">Evaluates constraints &amp;</text>
    <text x="310" y="114" font-family="sans-serif" font-size="12" fill="#94a3b8">generates JSON tool call:</text>
    <text x="310" y="136" font-family="monospace" font-size="11" fill="#38bdf8">check_availability()</text>

    <!-- Arrow 2 -->
    <path d="M 530 85 L 590 85" stroke="#a855f7" stroke-width="2"/>
    <polygon points="590,85 582,80 582,90" fill="#a855f7"/>

    <!-- Node 3: CRM Tool Execution -->
    <rect x="590" y="20" width="230" height="130" rx="14" fill="url(#cardGrad3)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="610" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#6366f1" letter-spacing="1">STEP 03: TOOL EXEC</text>
    <text x="610" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">GHL API Execution</text>
    <text x="610" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">Verifies open slots,</text>
    <text x="610" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">updates contact tag</text>

    <!-- Arrow 3 -->
    <path d="M 820 85 L 880 85" stroke="#a855f7" stroke-width="2"/>
    <polygon points="880,85 872,80 872,90" fill="#a855f7"/>

    <!-- Node 4: Synthesis & Safe Hand-off -->
    <rect x="880" y="20" width="210" height="130" rx="14" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.5"/>
    <text x="900" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">STEP 04: OUTCOME</text>
    <text x="900" y="80" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Confirmed Slot</text>
    <text x="900" y="104" font-family="sans-serif" font-size="12" fill="#94a3b8">Natural SMS reply sent;</text>
    <text x="900" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">human alert if needed</text>
  </g>

  <!-- Brand Signature -->
  <text x="1120" y="580" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="end">GHLVertex AI Agent Architecture</text>
</svg>
