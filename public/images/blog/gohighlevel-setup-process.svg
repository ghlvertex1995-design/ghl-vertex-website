<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0d2447"/>
      <stop offset="100%" stop-color="#050e1c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152e52" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1a30" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#grid2)"/>

  <circle cx="280" cy="220" r="260" fill="#0284c7" opacity="0.16" filter="blur(60px)"/>
  <circle cx="920" cy="380" r="220" fill="#38bdf8" opacity="0.14" filter="blur(60px)"/>

  <!-- Eyebrow Badge -->
  <rect x="80" y="80" width="220" height="36" rx="18" fill="rgba(2, 132, 199, 0.25)" stroke="#38bdf8" stroke-width="1"/>
  <text x="190" y="103" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">IMPLEMENTATION FRAMEWORK</text>

  <!-- Titles -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    How to Set Up GoHighLevel
  </text>
  <text x="80" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#cyanGrad)" letter-spacing="-0.5">
    A Step-by-Step Business Setup Guide
  </text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">
    Business Process First • CRM Architecture • Custom Pipelines • Workflows • Rigorous QA Testing
  </text>

  <!-- Setup Stages Flow -->
  <g transform="translate(80, 335)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="180" height="175" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="14" fill="#0284c7"/>
    <text x="36" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="24" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Process Mapping</text>
    <text x="24" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">Define rules,</text>
    <text x="24" y="123" font-family="sans-serif" font-size="12" fill="#94a3b8">owners &amp; criteria</text>

    <!-- Connector 1 -->
    <line x1="180" y1="88" x2="225" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,88 217,83 217,93" fill="#38bdf8"/>

    <!-- Stage 2 -->
    <rect x="225" y="0" width="180" height="175" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="261" cy="34" r="14" fill="#0284c7"/>
    <text x="261" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="249" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">CRM &amp; Pipeline</text>
    <text x="249" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">Custom fields &amp;</text>
    <text x="249" y="123" font-family="sans-serif" font-size="12" fill="#94a3b8">deterministic stages</text>

    <!-- Connector 2 -->
    <line x1="405" y1="88" x2="450" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="450,88 442,83 442,93" fill="#38bdf8"/>

    <!-- Stage 3 -->
    <rect x="450" y="0" width="180" height="175" rx="14" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="486" cy="34" r="14" fill="#38bdf8"/>
    <text x="486" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#071324" text-anchor="middle">3</text>
    <text x="474" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Intake &amp; Calendar</text>
    <text x="474" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">Forms, round-robin,</text>
    <text x="474" y="123" font-family="sans-serif" font-size="12" fill="#94a3b8">phone &amp; SMS config</text>

    <!-- Connector 3 -->
    <line x1="630" y1="88" x2="675" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="675,88 667,83 667,93" fill="#38bdf8"/>

    <!-- Stage 4 -->
    <rect x="675" y="0" width="180" height="175" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="711" cy="34" r="14" fill="#0284c7"/>
    <text x="711" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="699" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Modular Workflows</text>
    <text x="699" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">Triggers, stop logic</text>
    <text x="699" y="123" font-family="sans-serif" font-size="12" fill="#94a3b8">&amp; attendance nurture</text>

    <!-- Connector 4 -->
    <line x1="855" y1="88" x2="900" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="900,88 892,83 892,93" fill="#38bdf8"/>

    <!-- Stage 5 -->
    <rect x="900" y="0" width="180" height="175" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="936" cy="34" r="14" fill="#10B981"/>
    <text x="936" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="924" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">QA &amp; Handover</text>
    <text x="924" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">Edge-case testing</text>
    <text x="924" y="123" font-family="sans-serif" font-size="12" fill="#94a3b8">&amp; team training</text>
  </g>

  <!-- Brand Signature -->
  <text x="1120" y="580" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="end">GHLVertex Setup Architecture</text>
</svg>
