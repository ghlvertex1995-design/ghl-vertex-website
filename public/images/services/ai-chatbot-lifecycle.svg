    <rect width="150" height="258" rx="12" fill="url(#cardGradChat)" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#0284c7"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">03</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Knowledge</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Preparation</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Ingest FAQs &amp; SOPs</text>
