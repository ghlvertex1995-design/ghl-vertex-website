<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" width="1260" height="520" role="img" aria-labelledby="ai-chat-lifecycle-title ai-chat-lifecycle-desc">
  <title id="ai-chat-lifecycle-title">Seven-Stage AI Chatbot Development Process Lifecycle</title>
  <desc id="ai-chat-lifecycle-desc">Visual workflow showing the seven phases of AI chatbot development services at GHLVertex: Stage 1 Requirements Discovery, Stage 2 Journey Mapping, Stage 3 Knowledge Preparation, Stage 4 Architecture and Model Selection, Stage 5 Development and Integration, Stage 6 Testing and Evaluation, and Stage 7 Deployment and Handoff.</desc>
  <defs>
    <linearGradient id="bgGradChat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071228"/>
      <stop offset="100%" stop-color="#0c1d3d"/>
    </linearGradient>
    <linearGradient id="cardGradChat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142647"/>
      <stop offset="100%" stop-color="#0d1b36"/>
    </linearGradient>
    <linearGradient id="accentGradChat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0148A3"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrowHeadChat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1260" height="520" rx="18" fill="url(#bgGradChat)"/>
  <rect x="1" y="1" width="1258" height="518" rx="17" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Subtle Ambient Dots -->
  <g fill="#1e3a5f" opacity="0.4">
    <circle cx="50" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="190" cy="40" r="1.5"/>
    <circle cx="1070" cy="40" r="1.5"/><circle cx="1140" cy="40" r="1.5"/><circle cx="1210" cy="40" r="1.5"/>
    <circle cx="50" cy="480" r="1.5"/><circle cx="120" cy="480" r="1.5"/><circle cx="1210" cy="480" r="1.5"/>
  </g>

  <!-- Header Section -->
  <rect x="40" y="32" width="280" height="28" rx="14" fill="#0148A3" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
  <text x="180" y="51" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#7dd3fc">GHLVERTEX DEVELOPMENT LIFECYCLE</text>
  <text x="40" y="94" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Seven-Stage AI Chatbot Engineering Process</text>
  <text x="40" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Disciplined execution from conversational discovery to grounded knowledge, CRM integration, testing, and team handoff</text>

  <!-- Progress Bar Line -->
  <rect x="40" y="148" width="1180" height="4" rx="2" fill="url(#accentGradChat)" opacity="0.85"/>

  <!-- Stage 01: Requirements Discovery -->
  <g transform="translate(40, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradChat)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#0148A3"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">01</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Requirements</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Discovery</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Business goals</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Audience personas</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Common inquiries</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Channel selection</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: DISCOVERY BRIEF</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="192" y1="305" x2="208" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHeadChat)"/>

  <!-- Stage 02: Journey Mapping -->
  <g transform="translate(210, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradChat)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#0369a1"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">02</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Journey</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Mapping</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Conversation paths</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Lead qualification</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Booking flows</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Handoff criteria</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: DIALOGUE MAP</text>
  </g>

