    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Grounding rules</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Missing data policy</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#38bdf8">OUTPUT: KNOWLEDGE BASE</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="532" y1="305" x2="548" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHeadChat)"/>

