    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">04</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Architecture &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Model Selection</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Select foundation LLM</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; System prompts</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Context limits</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Output validation</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#22d3ee">OUTPUT: ARCH BLUEPRINT</text>
  </g>

  <!-- Arrow 4->5 -->
  <line x1="702" y1="305" x2="718" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHeadChat)"/>

