  <text x="630" y="479" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Every AI chatbot is grounded in verified company knowledge with direct CRM synchronization and transparent human handoff.</text>
</svg>