    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Build &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Integration</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Widget embedding</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; GoHighLevel sync</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Calendar API hooks</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Live handoff gates</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#5eead4">OUTPUT: STAGED BOT</text>
  </g>

  <!-- Arrow 5->6 -->
  <line x1="872" y1="305" x2="888" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHeadChat)"/>

