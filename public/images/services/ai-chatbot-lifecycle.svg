  <g transform="translate(890, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradChat)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#059669"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">06</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Testing &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Evaluation</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Simulate user chats</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Test prompt defense</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Verify booking flow</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Check handoff alerts</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#6ee7b7">OUTPUT: QA EVAL REPORT</text>
  </g>

  <!-- Arrow 6->7 -->
  <line x1="1042" y1="305" x2="1058" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHeadChat)"/>

  <!-- Stage 07: Deployment & Handoff -->
  <g transform="translate(1060, 176)">
    <rect width="160" height="258" rx="12" fill="url(#cardGradChat)" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#10b981"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#042f1a">07</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Deployment &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Team Handoff</text>
    <line x1="12" y1="98" x2="148" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Live channel launch</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Analytics dashboard</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Video staff walkthrough</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; 100% system ownership</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0">OUTPUT: LIVE CHATBOT</text>
