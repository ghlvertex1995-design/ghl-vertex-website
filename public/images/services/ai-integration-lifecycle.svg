    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Schema guards</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Fallback routes</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#22d3ee">OUTPUT: ARCH BLUEPRINT</text>
