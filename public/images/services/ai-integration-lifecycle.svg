  <text x="630" y="479" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#94a3b8">Every AI integration connects intelligent models to existing business systems through resilient API middleware with zero vendor lock-in.</text>
