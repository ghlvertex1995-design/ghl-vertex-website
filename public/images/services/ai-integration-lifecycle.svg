    <circle cx="50" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="190" cy="40" r="1.5"/>
    <circle cx="1070" cy="40" r="1.5"/><circle cx="1140" cy="40" r="1.5"/><circle cx="1210" cy="40" r="1.5"/>
    <circle cx="50" cy="480" r="1.5"/><circle cx="120" cy="480" r="1.5"/><circle cx="1210" cy="480" r="1.5"/>
  </g>

  <!-- Header Section -->
