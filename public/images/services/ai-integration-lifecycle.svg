    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; PII redaction rules</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Queue worker setup</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Custom field mapping</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#5eead4">OUTPUT: STAGED BUILD</text>
  </g>

