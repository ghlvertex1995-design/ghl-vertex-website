    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Current stack</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; CRM &amp; DB setup</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Security policies</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Tool dependencies</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: TECH AUDIT</text>
