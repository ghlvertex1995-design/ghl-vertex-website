  <!-- Footer Tagline -->
  <text x="630" y="475" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">Verified engineering guardrails, least-privilege tool allowlists, and human-in-the-loop oversight at every operational stage.</text>
</svg>
