    <rect width="150" height="258" rx="12" fill="url(#cardGradAgent)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#0284c7"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">03</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Tool, Data &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Permissions</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Tool allowlists</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Least privilege</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Read/write rules</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; API credentialing</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: TOOL SCHEMAS</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="536" y1="305" x2="552" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHeadAgent)"/>

  <!-- Stage 04: Architecture & Model Selection -->
  <g transform="translate(556, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradAgent)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#06b6d4"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">04</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Architecture &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Model Selection</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Single vs multi-agent</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; LLM benchmarking</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Memory design</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Latency budgeting</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: ARCH BLUEPRINT</text>
  </g>

  <!-- Arrow 4->5 -->
  <line x1="708" y1="305" x2="724" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHeadAgent)"/>

  <!-- Stage 05: Development & Integration -->
  <g transform="translate(728, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradAgent)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#0d9488"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">05</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Development &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Integration</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Tool calling hooks</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; CRM webhook wiring</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Structured JSON</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Circuit breakers</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: AGENT RUNTIME</text>
  </g>

  <!-- Arrow 5->6 -->
  <line x1="880" y1="305" x2="896" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHeadAgent)"/>

  <!-- Stage 06: Evaluation & Security Testing -->
  <g transform="translate(900, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradAgent)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#10b981"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">06</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Evaluation &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Security Testing</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Automated Evals</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Prompt injection</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Tool failure simulation</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Human handover gate</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: EVAL REPORT</text>
  </g>

  <!-- Arrow 6->7 -->
  <line x1="1052" y1="305" x2="1068" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHeadAgent)"/>

  <!-- Stage 07: Deployment & Handoff -->
  <g transform="translate(1070, 176)">
    <rect width="150" height="258" rx="12" fill="url(#cardGradAgent)" stroke="#23416b" stroke-width="1.5"/>
    <rect x="12" y="16" width="38" height="24" rx="6" fill="#10b981"/>
    <text x="31" y="33" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#ffffff">07</text>
    <text x="12" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Deployment &amp;</text>
    <text x="12" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Handoff</text>
    <line x1="12" y1="98" x2="138" y2="98" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Cloud deployment</text>
    <text x="12" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Observability logs</text>
    <text x="12" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Operational SOPs</text>
    <text x="12" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">&#8226; Team walkthrough</text>
    <text x="12" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc">OUTPUT: PRODUCTION AGENT</text>
