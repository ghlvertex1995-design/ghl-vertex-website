name: Scheduled Blog Publisher

on:
  schedule:
    # Runs every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-and-publish:
    name: Refresh Scheduled Content
    runs-on: ubuntu-latest
    steps:
      - name: Ping Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Deploy hook detected. Triggering production revalidation..."
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Rebuild triggered successfully."
          else
            echo "No VERCEL_DEPLOY_HOOK secret set yet. Ready when configured in GitHub repository secrets."
          fi
